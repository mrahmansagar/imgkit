[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imgkit"
version = "0.1.0"
description = "Utility tools for 2D/3D image I/O, normalization, and visualization."
readme = "README.md"
requires-python = ">=3.11.18"
dependencies = [
    "numpy",
    "tifffile",
    "imageio",
    "natsort",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
